assert_lefthook_installed: true

pre-push:
  jobs:
    - name: host
      script: host.sh
      runner: sh
      args: '--'
    - name: checks
      group:
        parallel: true
        jobs:
          - name: python
            script: python.sh
            runner: sh
            args: '--'
          - name: tracked-files
            script: tracked-files.sh
            runner: sh
            args: '--'
          - name: font-metadata
            script: font-metadata.sh
            runner: sh
            args: '--'
